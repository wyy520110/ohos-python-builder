name: Build Python for OHOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Harmonybrew/ohos-python
        uses: actions/checkout@v4
        with:
          repository: Harmonybrew/ohos-python
          ref: main

      - name: Check SDK clang binary format
        run: |
          curl -fL -o ohos-sdk.tar.gz https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public_20260829.tar.gz
          tar -zxf ohos-sdk.tar.gz -C ./ ohos-sdk/ohos
          cd ohos-sdk/ohos
          unzip -q native-*.zip
          file native/llvm/bin/clang
          file native/llvm/bin/clang++
          ls -la native/llvm/bin/clang*

      - name: Patch build.sh
        run: |
          sed -i '/Harmonybrew\/ohos-coreutils/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-unzip/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-grep/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-gawk/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-make/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-tar/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-gzip/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-perl/s/^/#SKIP: /' build.sh
          sed -i '/^ln -sf.*ohos-arm64/s/^/#SKIP: /' build.sh
          sed -i '/^ln -s clang/s/^/#SKIP: /' build.sh
          sed -i '/^ln -s clang++/s/^/#SKIP: /' build.sh
          sed -i '/^ln -s ld\.lld/s/^/#SKIP: /' build.sh
          sed -i '/^ln -s llvm-/s/^/#SKIP: /' build.sh
          sed -i 's|exec /opt/ohos-sdk/ohos/native/llvm/bin/\ "\\\$@"|exec /opt/ohos-sdk/ohos/native/llvm/bin/ --target=aarch64-linux-ohos --sysroot=/opt/ohos-sdk/ohos/native/sysroot "$@"|' build.sh
          sed -i '/^export CFLAGS/a export CC="/bin/clang"\nexport CXX="/bin/clang++"\nexport AR="/bin/llvm-ar"\nexport RANLIB="/bin/llvm-ranlib"\nexport LD="/bin/ld.lld"' build.sh
          sed -i '/\.\/configure/s/$/ --enable-shared/' build.sh

      - name: Build
        run: sudo -E bash build.sh

      - name: Check output
        run: |
          find python-3.14.6-ohos-arm64 -name "python3*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No python3 found"
          find python-3.14.6-ohos-arm64 -name "libpython*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No libpython found"
          ls -la python-3.14.6-ohos-arm64/bin/ 2>/dev/null || echo "No bin dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-ohos-shared
          path: python-3.14.6-ohos-arm64.tar.gz
          retention-days: 30