name: Build Python for OHOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Harmonybrew/ohos-python
        uses: actions/checkout@v4
        with:
          repository: Harmonybrew/ohos-python
          ref: main

      - name: Setup SDK and compilers
        run: |
          set -ex
          
          curl -fL -o ohos-sdk.tar.gz https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public_20260829.tar.gz
          tar -zxf ohos-sdk.tar.gz
          rm -rf ohos-sdk.tar.gz
          
          cd ohos-sdk/linux
          unzip -q native-linux-x64-*.zip
          unzip -q toolchains-linux-x64-*.zip
          rm -rf *.zip
          cd -
          
          sudo mkdir -p /opt/ohos-sdk
          sudo cp -r ohos-sdk/linux /opt/ohos-sdk/linux
          
          echo '#!/bin/sh' | sudo tee /bin/clang
          echo 'exec /opt/ohos-sdk/linux/native/llvm/bin/clang --target=aarch64-linux-ohos --sysroot=/opt/ohos-sdk/linux/native/sysroot -x c "$@"' | sudo tee -a /bin/clang
          sudo chmod 0755 /bin/clang
          
          echo '#!/bin/sh' | sudo tee /bin/clang++
          echo 'exec /opt/ohos-sdk/linux/native/llvm/bin/clang++ --target=aarch64-linux-ohos --sysroot=/opt/ohos-sdk/linux/native/sysroot "$@"' | sudo tee -a /bin/clang++
          sudo chmod 0755 /bin/clang++
          
          for tool in ld.lld llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-addr2line llvm-cxxfilt llvm-size llvm-strings; do
              echo '#!/bin/sh' | sudo tee /bin/
              echo "exec /opt/ohos-sdk/linux/native/llvm/bin/ \"\$@\"" | sudo tee -a /bin/
              sudo chmod 0755 /bin/
          done

      - name: Patch and build
        run: |
          set -ex
          
          sed -i '/Harmonybrew\/ohos/s/^/#SKIP: /' build.sh
          sed -i '/^ln -sf/s/^/#SKIP: /' build.sh
          sed -i '/^ln -s /s/^/#SKIP: /' build.sh
          sed -i '/curl.*ohos-sdk/s/^/#SKIP: /' build.sh
          sed -i '/tar.*ohos-sdk/s/^/#SKIP: /' build.sh
          sed -i '/cd ohos-sdk/s/^/#SKIP: /' build.sh
          sed -i '/unzip -q/s/^/#SKIP: /' build.sh
          sed -i '/cat.*<<EOF/s/^/#SKIP: /' build.sh
          sed -i '/^for executable/s/^/#SKIP: /' build.sh
          sed -i '/^essential_tools/s/^/#SKIP: /' build.sh
          sed -i '/^    cat/s/^/#SKIP: /' build.sh
          sed -i '/^    chmod/s/^/#SKIP: /' build.sh
          sed -i '/^done/s/^/#SKIP: /' build.sh
          sed -i '/^EOF/s/^/#SKIP: /' build.sh
          sed -i '/rm -rf \*\.zip/s/^/#SKIP: /' build.sh
          sed -i '/\.\/configure/s/$/ --enable-shared/' build.sh
          
          export CFLAGS="-fPIC -D__aarch64__ -D__ARM_ARCH=8 -D__ARM_ARCH_8A__"
          export CPPFLAGS="-I/opt/deps/include -D__MUSL__"
          export LDFLAGS="-L/opt/deps/lib"
          export CC="/bin/clang"
          export CXX="/bin/clang++"
          export AR="/bin/llvm-ar"
          export RANLIB="/bin/llvm-ranlib"
          export LD="/bin/ld.lld"
          
          sudo -E bash build.sh

      - name: Check output
        run: |
          find python-3.14.6-ohos-arm64 -name "python3*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No python3 found"
          find python-3.14.6-ohos-arm64 -name "libpython*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No libpython found"
          ls -la python-3.14.6-ohos-arm64/bin/ 2>/dev/null || echo "No bin dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-ohos-shared
          path: python-3.14.6-ohos-arm64.tar.gz
          retention-days: 30