name: Build Python for OHOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Harmonybrew/ohos-python
        uses: actions/checkout@v4
        with:
          repository: Harmonybrew/ohos-python
          ref: main

      - name: Setup SDK and compilers
        run: |
          set -ex
          curl -fL -o ohos-sdk.tar.gz https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public_20260829.tar.gz
          tar -zxf ohos-sdk.tar.gz
          rm -rf ohos-sdk.tar.gz
          cd ohos-sdk/linux
          unzip -q native-linux-x64-*.zip
          unzip -q toolchains-linux-x64-*.zip
          rm -rf *.zip
          cd -
          sudo mkdir -p /opt/ohos-sdk
          sudo cp -r ohos-sdk/linux /opt/ohos-sdk/linux
          echo '#!/bin/sh' | sudo tee /bin/clang
          echo 'exec /opt/ohos-sdk/linux/native/llvm/bin/clang --target=aarch64-linux-ohos --sysroot=/opt/ohos-sdk/linux/native/sysroot "$@"' | sudo tee -a /bin/clang
          sudo chmod 0755 /bin/clang
          echo '#!/bin/sh' | sudo tee /bin/clang++
          echo 'exec /opt/ohos-sdk/linux/native/llvm/bin/clang --target=aarch64-linux-ohos --sysroot=/opt/ohos-sdk/linux/native/sysroot "$@"' | sudo tee -a /bin/clang++
          sudo chmod 0755 /bin/clang++
          for tool in ld.lld llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-addr2line llvm-cxxfilt llvm-size llvm-strings; do
              echo '#!/bin/sh' | sudo tee /bin/$tool
              echo "exec /opt/ohos-sdk/linux/native/llvm/bin/$tool \"\$@\"" | sudo tee -a /bin/$tool
              sudo chmod 0755 /bin/$tool
          done
          echo '#!/bin/sh' | sudo tee /bin/strip
          echo 'exec /opt/ohos-sdk/linux/native/llvm/bin/llvm-strip "$@"' | sudo tee -a /bin/strip
          sudo chmod 0755 /bin/strip

      - name: Patch and build
        run: |
          set -ex
          python3 << 'PYEOF'
          with open('build.sh', 'r') as f:
              lines = f.readlines()
          skip_patterns = [
              'Harmonybrew/ohos-',
              'ln -sf',
              'ln -s ',
              'curl.*ohos-sdk',
              'tar.*ohos-sdk',
              'cd ohos-sdk',
              'unzip -q',
              'xargs',
              'rm -rf *.tar.gz',
          ]
          in_while_loop = False
          in_for_loop = False
          in_multiline_skip = False
          in_gettext = False
          new_lines = []
          current_dir = ""
          for i, line in enumerate(lines):
              should_skip = False
              for pat in skip_patterns:
                  if pat in line:
                      should_skip = True
                      break
              if in_multiline_skip:
                  should_skip = True
                  if not line.rstrip().endswith('\\'):
                      in_multiline_skip = False
              elif should_skip and line.rstrip().endswith('\\'):
                  in_multiline_skip = True
              if 'while read' in line:
                  in_while_loop = True
                  should_skip = True
              if in_while_loop:
                  if line.strip().startswith('done'):
                      in_while_loop = False
                      should_skip = True
                  else:
                      should_skip = True
              if line.strip().startswith('for executable in'):
                  in_for_loop = True
                  should_skip = True
              if in_for_loop:
                  if line.strip() == 'done':
                      in_for_loop = False
                      should_skip = True
                  else:
                      should_skip = True
              line = line.replace('/opt/ohos-sdk/ohos/', '/opt/ohos-sdk/linux/')
              if line.strip().startswith('cd ') and 'ohos-sdk' not in line:
                  current_dir = line.strip().split()[1]
              if 'cd gettext' in line:
                  in_gettext = True
              if in_gettext:
                  should_skip = True
                  if line.strip() == 'cd $WORKDIR' or line.strip().startswith('cd /'):
                      in_gettext = False
              # Handle configure commands
              if './configure' in line:
                  if 'Python' in current_dir:
                      # Python configure: add --enable-shared, --with-build-python, --build, --host
                      if '--enable-shared' not in line:
                          line = line.rstrip() + ' --enable-shared\n'
                      if '--with-build-python' not in line:
                          line = line.rstrip() + ' --with-build-python=/usr/bin/python3\n'
                      if '--build' not in line:
                          line = line.rstrip() + ' --build=x86_64-linux-gnu --host=aarch64-linux-gnu\n'
                  elif 'zlib' not in current_dir and not in_gettext and '--host' not in line:
                      line = line.replace('./configure', './configure --host=aarch64-linux-gnu --build=x86_64-linux-gnu')
              if './Configure' in line and 'linux-aarch64' in line:
                  new_lines.append(line)
                  new_lines.append('sed -i "s/\\bprivate\\b/priv/g" apps/include/apps.h\n')
                  should_skip = True
              if should_skip:
                  new_lines.append('#SKIP: ' + line)
              else:
                  new_lines.append(line)
          with open('build.sh', 'w') as f:
              f.writelines(new_lines)
          print(f"Patched {len(new_lines)} lines")
          PYEOF
          export CFLAGS="-fPIC -std=c11 -D__aarch64__ -D__ARM_ARCH=8 -D__ARM_ARCH_8A__"
          export CPPFLAGS="-I/opt/deps/include -D__MUSL__"
          export LDFLAGS="-L/opt/deps/lib"
          export CC="/bin/clang"
          export CXX="/bin/clang++"
          export AR="/bin/llvm-ar"
          export RANLIB="/bin/llvm-ranlib"
          export LD="/bin/ld.lld"
          export STRIP="/bin/strip"
          export CHOST="aarch64-linux-gnu"
          sudo -E bash build.sh

      - name: Check output
        run: |
          find python-3.14.6-ohos-arm64 -name "python3*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No python3 found"
          find python-3.14.6-ohos-arm64 -name "libpython*" -type f -exec ls -lh {} \; 2>/dev/null || echo "No libpython found"
          ls -la python-3.14.6-ohos-arm64/bin/ 2>/dev/null || echo "No bin dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-ohos-shared
          path: python-3.14.6-ohos-arm64.tar.gz
          retention-days: 30